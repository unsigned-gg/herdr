# In-house distribution releases for the unsigned-gg fork of herdr.
#
# Tag pattern: ug-v<upstream-version>.<inhouse-rev>  (e.g. ug-v0.8.0.1)
# Deliberately disjoint from upstream's v* pattern so syncing upstream tags
# into this fork can never trigger a release, and pushing our tags can never
# trigger upstream's release.yml ceremony (nix flake-check, website build,
# changelog validation) — none of which applies to a distribution build.
#
# Scope: the two Linux musl targets the estate consumes. macOS targets can be
# lifted from upstream release.yml if a consumer appears.
#
# SOP: ~/.agents/sops/herdr-fork-and-distribution.md (estate brief indexed).

name: Release (unsigned)

on:
  push:
    tags:
      - "ug-v*"
  # Fork consent gate: GitHub does not deliver push-event runs on a fork
  # until "Enable workflows" is clicked in the Actions UI (API cannot do
  # it — proven 2026-08-06: zero push runs ever, dispatch runs fine).
  # workflow_dispatch AT THE TAG REF (gh workflow run --ref refs/tags/...)
  # is the equivalent path: GITHUB_REF_NAME resolves to the tag either way.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            name: herdr-linux-aarch64
    runs-on: ubuntu-latest
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify tag base version matches Cargo.toml
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # ug-v0.8.0.1 -> base 0.8.0 (strip prefix, strip trailing .N)
          BASE_VERSION=$(echo "${GITHUB_REF_NAME#ug-v}" | sed 's/\.[0-9]*$//')
          if [ "$CARGO_VERSION" != "$BASE_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME (base $BASE_VERSION) doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Prefer official Ubuntu mirrors over Azure
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-unsigned-${{ matrix.target }}

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          prerelease: false
          make_latest: true
          body: >
            In-house distribution build of herdr for the unsigned estate.
            Base: upstream ${{ github.ref_name }} (see tag base version).
            Not an upstream release — upstream is https://github.com/herdrdev/herdr.
          files: |
            herdr-linux-x86_64/herdr-linux-x86_64
            herdr-linux-aarch64/herdr-linux-aarch64
