[package]
name = "spiffe-svid"
description = "Pure line-rate JWT-SVID verification, JWKS caching, and RFC 8693 nested act delegation chain validation against the estate SPIFFE trust domain (unsigned.gg)"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spiffe = { version = "0.16", default-features = false, features = ["jwt-verify-aws-lc-rs"] }
thiserror = "2"
openssl = { version = "0.10", optional = true }

[features]
default = []
test-support = ["dep:openssl"]

[dev-dependencies]
openssl = "0.10"
tokio = { version = "1", features = ["macros", "rt"] }
